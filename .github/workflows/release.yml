name: release

on:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  package:
    name: Test and build the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the test suite
        run: node --test
      - name: Validate the manifest and the store listing
        run: node scripts/package.mjs --check
      - name: Build the package
        run: node scripts/package.mjs
      - name: Check the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="v$(node -p 'require("./manifest.json").version')"
          test "$version" = "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: gridpane-alerts
          path: dist/gridpane-alerts-*.zip
          if-no-files-found: error

  release:
    name: Publish the release asset
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gridpane-alerts
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --title "$GITHUB_REF_NAME"
